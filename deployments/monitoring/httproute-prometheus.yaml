apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: shared-gateway
      namespace: infra
  hostnames:
    - "prometheus.dev.nilsherzig.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-service
          port: 9090
