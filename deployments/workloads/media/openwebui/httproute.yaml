apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openwebui-http-route
spec:
  parentRefs:
    - name: shared-gateway
      namespace: infra
  hostnames:
    - "chat.dev.nilsherzig.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openwebui
          port: 80
